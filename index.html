<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Break-Even — kWh vs Gas</title>

<!-- iOS home-screen app behavior -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Break-Even">
<meta name="theme-color" content="#0A0F12">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%230A0F12'/%3E%3Cpath d='M96 26 L58 96 h30 l-8 58 l42-74 h-32 z' fill='%235BE0D6'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Chivo+Mono:wght@300;400;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0A0F12;
    --panel:#131C21;
    --panel-hi:#1B262C;
    --line:#26343B;
    --ink:#E7EFF2;
    --muted:#7F9099;
    --volt:#5BE0D6;   /* electricity */
    --fuel:#E9963E;   /* gasoline */
    --mono:'Chivo Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans:'Archivo', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html{background:var(--bg);}

  body{
    font-family:var(--sans);
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    padding:
      calc(env(safe-area-inset-top) + 22px)
      calc(env(safe-area-inset-right) + 20px)
      calc(env(safe-area-inset-bottom) + 36px)
      calc(env(safe-area-inset-left) + 20px);
    max-width:520px;
    margin:0 auto;
  }

  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    font-weight:400;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--muted);
  }

  /* ---------- Hero readout ---------- */

  .hero{
    padding:30px 0 26px;
    border-bottom:1px solid var(--line);
  }
  .hero .eyebrow{display:block; margin-bottom:16px;}

  .readout{
    display:flex;
    align-items:baseline;
    gap:4px;
    font-family:var(--mono);
    font-weight:300;
    color:var(--volt);
    line-height:.9;
  }
  .readout .dollar{font-size:34px; font-weight:400; transform:translateY(-14px);}
  .readout .value{font-size:78px; letter-spacing:-.03em; font-variant-numeric:tabular-nums;}
  .readout .unit{
    font-size:14px; font-weight:400; color:var(--muted);
    letter-spacing:.08em; margin-left:8px;
  }
  .readout.dim{color:var(--muted);}

  .hero p{
    margin-top:18px;
    font-size:14.5px;
    line-height:1.5;
    color:var(--muted);
    max-width:34em;
  }
  .hero p b{color:var(--ink); font-weight:500;}

  /* ---------- Signature: the crossover scale ---------- */

  .scale{margin:26px 0 4px;}
  .track{
    position:relative;
    height:34px;
    border-radius:3px;
    overflow:hidden;
    background:
      linear-gradient(90deg,
        rgba(91,224,214,.26) 0%,
        rgba(91,224,214,.07) 49.6%,
        rgba(233,150,62,.07) 50.4%,
        rgba(233,150,62,.26) 100%);
  }
  .tick{
    position:absolute; top:0; bottom:0; left:50%;
    width:1px; background:var(--ink); opacity:.55;
  }
  .dot{
    position:absolute; top:50%; left:50%;
    width:13px; height:13px; border-radius:50%;
    background:var(--ink);
    border:3px solid var(--bg);
    transform:translate(-50%,-50%);
    transition:left .22s cubic-bezier(.4,0,.2,1);
    opacity:0;
  }
  .dot.on{opacity:1;}

  .scale-legend{
    display:flex; justify-content:space-between;
    margin-top:9px;
    font-family:var(--mono); font-size:10.5px;
    letter-spacing:.14em; text-transform:uppercase;
  }
  .scale-legend .l{color:var(--volt);}
  .scale-legend .r{color:var(--fuel);}

  /* ---------- Inputs ---------- */

  .fields{margin-top:34px; display:flex; flex-direction:column; gap:2px;}

  .field{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px;
    background:var(--panel);
    padding:15px 16px;
    border:1px solid var(--line);
  }
  .field:first-of-type{border-radius:8px 8px 0 0;}
  .field:last-of-type{border-radius:0 0 8px 8px;}
  .field + .field{border-top:none;}

  .field label{
    font-size:14.5px; font-weight:500; line-height:1.35;
  }
  .field .sub{
    display:block;
    font-family:var(--mono); font-size:10.5px; font-weight:400;
    letter-spacing:.13em; text-transform:uppercase;
    color:var(--muted); margin-top:5px;
  }

  .entry{display:flex; align-items:center; gap:5px; flex-shrink:0;}
  .entry .pre{font-family:var(--mono); font-size:17px; color:var(--muted);}

  input[type=text]{
    width:82px;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    color:var(--ink);
    font-family:var(--mono);
    font-size:22px;           /* 16px+ stops iOS zoom-on-focus */
    font-weight:400;
    font-variant-numeric:tabular-nums;
    text-align:right;
    padding:3px 2px 5px;
    border-radius:0;
    -webkit-appearance:none;
  }
  input[type=text]:focus{
    outline:none;
    border-bottom-color:var(--volt);
  }
  input.bad{color:var(--fuel); border-bottom-color:var(--fuel);}

  /* ---------- Live comparison ---------- */

  .compare{
    margin-top:26px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--panel);
    overflow:hidden;
  }
  .compare-head{
    padding:15px 16px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    border-bottom:1px solid var(--line);
    background:var(--panel-hi);
  }
  .compare-head label{font-size:14.5px; font-weight:500;}

  .verdict{padding:17px 16px 18px;}
  .verdict .line{
    font-family:var(--mono);
    font-size:15px; line-height:1.45; letter-spacing:-.01em;
  }
  .verdict .line.idle{color:var(--muted); font-size:13px; letter-spacing:.02em;}
  .verdict .win-volt{color:var(--volt);}
  .verdict .win-fuel{color:var(--fuel);}

  .permile{
    display:flex; gap:0; margin-top:16px;
    border-top:1px solid var(--line); padding-top:15px;
  }
  .permile div{flex:1;}
  .permile .k{
    font-family:var(--mono); font-size:10px; letter-spacing:.15em;
    text-transform:uppercase; color:var(--muted);
  }
  .permile .v{
    font-family:var(--mono); font-size:20px; font-weight:400;
    margin-top:6px; font-variant-numeric:tabular-nums;
  }
  .permile .fuel .v{color:var(--fuel);}
  .permile .volt .v{color:var(--volt);}

  /* ---------- Footer ---------- */

  footer{
    margin-top:30px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .formula{
    font-family:var(--mono); font-size:11px; line-height:1.6;
    color:var(--muted); letter-spacing:.01em;
  }
  button{
    font-family:var(--mono); font-size:11px;
    letter-spacing:.15em; text-transform:uppercase;
    color:var(--muted);
    background:transparent;
    border:1px solid var(--line);
    border-radius:6px;
    padding:10px 13px;
    flex-shrink:0;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  button:active{background:var(--panel-hi); color:var(--ink);}

  :focus-visible{outline:2px solid var(--volt); outline-offset:3px;}

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>

  <section class="hero">
    <span class="eyebrow">Break-even electricity price</span>

    <div class="readout" id="readout">
      <span class="dollar">$</span><span class="value" id="breakeven">0.363</span><span class="unit">per kWh</span>
    </div>

    <p id="explain">
      Charge below <b>$0.363/kWh</b> and driving on electricity costs less per mile than
      driving on gas. Above it, burn the gas.
    </p>

    <div class="scale">
      <div class="track">
        <div class="tick"></div>
        <div class="dot" id="dot"></div>
      </div>
      <div class="scale-legend">
        <span class="l">Electric cheaper</span>
        <span class="r">Gas cheaper</span>
      </div>
    </div>
  </section>

  <div class="fields">
    <div class="field">
      <label for="gas">Gasoline price<span class="sub">per gallon</span></label>
      <div class="entry">
        <span class="pre">$</span>
        <input type="text" id="gas" inputmode="decimal" autocomplete="off" value="4.40">
      </div>
    </div>

    <div class="field">
      <label for="mikwh">Electric efficiency<span class="sub">miles per kWh</span></label>
      <div class="entry">
        <input type="text" id="mikwh" inputmode="decimal" autocomplete="off" value="3.3">
      </div>
    </div>

    <div class="field">
      <label for="mpg">Gas efficiency<span class="sub">miles per gallon</span></label>
      <div class="entry">
        <input type="text" id="mpg" inputmode="decimal" autocomplete="off" value="40">
      </div>
    </div>
  </div>

  <div class="compare">
    <div class="compare-head">
      <label for="rate">What you actually pay</label>
      <div class="entry">
        <span class="pre">$</span>
        <input type="text" id="rate" inputmode="decimal" autocomplete="off" placeholder="—">
      </div>
    </div>
    <div class="verdict">
      <div class="line idle" id="verdict">Enter your electricity rate to compare.</div>
      <div class="permile">
        <div class="volt">
          <div class="k">Electric</div>
          <div class="v" id="pm-elec">—</div>
        </div>
        <div class="fuel">
          <div class="k">Gasoline</div>
          <div class="v" id="pm-gas">11.0¢</div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <div class="formula">
      break-even<br>= (price/gal ÷ mpg) × mi/kWh
    </div>
    <button id="reset" type="button">Reset</button>
  </footer>

<script>
(function () {
  'use strict';

  var DEFAULTS = { gas: '4.40', mikwh: '3.3', mpg: '40', rate: '' };
  var KEY = 'phev-breakeven-v1';
  var ids = ['gas', 'mikwh', 'mpg', 'rate'];
  var el = {};

  ids.forEach(function (id) { el[id] = document.getElementById(id); });

  var readout  = document.getElementById('readout');
  var beOut    = document.getElementById('breakeven');
  var explain  = document.getElementById('explain');
  var dot      = document.getElementById('dot');
  var verdict  = document.getElementById('verdict');
  var pmElec   = document.getElementById('pm-elec');
  var pmGas    = document.getElementById('pm-gas');

  // localStorage is wrapped: it works on a real host but is absent in some
  // sandboxed previews, and a throw there would take the whole app down.
  function save() {
    try {
      var o = {};
      ids.forEach(function (id) { o[id] = el[id].value; });
      localStorage.setItem(KEY, JSON.stringify(o));
    } catch (e) {}
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var o = JSON.parse(raw);
      ids.forEach(function (id) {
        if (typeof o[id] === 'string') el[id].value = o[id];
      });
    } catch (e) {}
  }

  function num(input, required) {
    var v = parseFloat(input.value.replace(/[^0-9.\-]/g, ''));
    var ok = isFinite(v) && v > 0;
    if (input.value.trim() === '' && !required) {
      input.classList.remove('bad');
      return null;
    }
    input.classList.toggle('bad', !ok);
    return ok ? v : NaN;
  }

  function cents(dollars) {
    return (dollars * 100).toFixed(1) + '¢';
  }

  function compute() {
    var gas   = num(el.gas, true);
    var mikwh = num(el.mikwh, true);
    var mpg   = num(el.mpg, true);
    var rate  = num(el.rate, false);

    var valid = isFinite(gas) && isFinite(mikwh) && isFinite(mpg);

    if (!valid) {
      readout.classList.add('dim');
      beOut.textContent = '—.———';
      explain.innerHTML = 'Every field needs a number above zero.';
      dot.classList.remove('on');
      pmGas.textContent = '—';
      pmElec.textContent = '—';
      verdict.className = 'line idle';
      verdict.textContent = 'Fix the highlighted fields to compare.';
      save();
      return;
    }

    var gasPerMile = gas / mpg;
    var breakEven  = gasPerMile * mikwh;

    readout.classList.remove('dim');
    beOut.textContent = breakEven.toFixed(3);
    explain.innerHTML =
      'Charge below <b>$' + breakEven.toFixed(3) + '/kWh</b> and driving on electricity ' +
      'costs less per mile than driving on gas. Above it, burn the gas.';
    pmGas.textContent = cents(gasPerMile);

    if (rate === null || !isFinite(rate)) {
      dot.classList.remove('on');
      pmElec.textContent = '—';
      verdict.className = 'line idle';
      verdict.textContent = rate === null
        ? 'Enter your electricity rate to compare.'
        : 'That rate isn\u2019t a number.';
      save();
      return;
    }

    var elecPerMile = rate / mikwh;
    pmElec.textContent = cents(elecPerMile);

    // Scale runs $0 to 2× break-even, so break-even sits dead center.
    var pct = Math.max(0, Math.min(100, (rate / (breakEven * 2)) * 100));
    dot.style.left = pct + '%';
    dot.classList.add('on');

    var gap = Math.abs(gasPerMile - elecPerMile);
    if (elecPerMile < gasPerMile) {
      verdict.className = 'line win-volt';
      verdict.textContent = 'Electricity wins by ' + cents(gap) + ' per mile.';
    } else if (elecPerMile > gasPerMile) {
      verdict.className = 'line win-fuel';
      verdict.textContent = 'Gasoline wins by ' + cents(gap) + ' per mile.';
    } else {
      verdict.className = 'line';
      verdict.textContent = 'Dead even — identical cost per mile.';
    }

    save();
  }

  ids.forEach(function (id) {
    el[id].addEventListener('input', compute);
  });

  document.getElementById('reset').addEventListener('click', function () {
    ids.forEach(function (id) { el[id].value = DEFAULTS[id]; });
    compute();
  });

  load();
  compute();
})();
</script>
</body>
</html>
